name: Instant checker private QA
on:
  push:
    branches:
      - feature/instant-checker-phase1-private
      - feature/instant-checker-render-fallback
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible clean install (committed lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify resolved Babel dependencies
        run: npm ls @babel/parser @babel/traverse @babel/core @vitejs/plugin-react
      - run: npx tsx --test tests/instant-checker.test.ts tests/instant-checker-concurrency.test.ts tests/instant-checker-render.test.ts
      - run: npm run lint
      - name: Real headless Chromium isolated hydration and SSRF smoke
        run: npx tsx --test tests/instant-render-browser.test.ts
      - run: npm run build
      - name: Inspect About page HTTP discrepancy (branch only)
        if: github.ref == 'refs/heads/feature/instant-checker-render-fallback'
        run: node tests/instant-about-diagnostic.mjs
      - name: Read-only Big Lake Candy evidence accuracy check (branch only)
        if: github.ref == 'refs/heads/feature/instant-checker-render-fallback'
        run: npx tsx tests/instant-biglake-accuracy-diagnostic.ts
      - name: Verify desktop and mobile checker report in headless Chromium
        run: npx tsx tests/instant-checker-ui-smoke.ts
      - name: Browser package footprint
        run: du -sh node_modules/@sparticuz/chromium node_modules/puppeteer-core || true
      - run: npx tsx tests/instant-checker-live.ts
      - name: Five-site before/after rendered website scan, measured
        run: npx tsx tests/instant-checker-render-live.ts
      - name: Read-only production endpoint smoke (main only)
        if: github.ref == 'refs/heads/main'
        run: node tests/instant-production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-checker-private-results
          path: |
            instant-checker-private-results.json
            instant-render-live-results.json
            qa-screenshots/instant-checker-*.png
          if-no-files-found: warn
