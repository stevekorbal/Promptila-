name: Instant checker private QA
on:
  push:
    branches:
      - feature/instant-checker-phase1-private
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diagnose Babel version resolution
        run: |
          echo "npm version $(npm --version)"
          echo "registry $(npm config get registry)"
          npm view @babel/parser@7.29.14 version
          npm view @babel/core@7.29.15 dependencies --json || true
          npm view @babel/traverse@7.29.15 dependencies --json || true
          npm view @babel/parser@7.29.15 version || true
      - name: Install dependencies (diagnostic)
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund --loglevel=verbose || {
            echo "RESOLUTION ERROR EXTRACT"
            grep -E "ETARGET|@babel/parser|@babel/core|@babel/traverse|fetch manifest" /home/runner/.npm/_logs/*debug-0.log | tail -n 75 || true
            exit 1
          }
      - run: npx tsx --test tests/instant-checker.test.ts
      - run: npm run lint
      - run: npm run build
      - run: npx tsx tests/instant-checker-live.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-checker-private-results
          path: instant-checker-private-results.json
          if-no-files-found: warn
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright
      - run: npx playwright install chromium
      - name: Capture private report screenshots
        run: |
          npm run dev > /tmp/instant-checker-dev.log 2>&1 &
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:3000/ai-visibility-checker > /dev/null && break
            sleep 1
          done
          node tests/instant-checker-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-checker-private-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
