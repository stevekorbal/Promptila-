name: Instant checker private QA
on:
  push:
    branches:
      - feature/instant-checker-phase1-private
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npx tsx --test tests/instant-checker.test.ts
      - run: npm run lint
      - run: npm run build
